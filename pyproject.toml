[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psx-predictor"
version = "0.1.0"
description = "Pakistan Stock Exchange (PSX) Prediction and Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Muhammad Asim", email = "masimbutt@gmail.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20240311",
    "respx>=0.21.0",
    "types-beautifulsoup4>=4.12.0",
]

[project.scripts]
psx = "psx_predictor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/psx_predictor"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "docs",
    "documents",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not external'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "external: tests requiring live network connectivity to external APIs or websites",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
