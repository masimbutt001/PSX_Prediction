# SBP policy rate decisions and PBS CPI releases used as macro features.
#
# Edit this file when the State Bank of Pakistan announces a new policy rate or the
# Pakistan Bureau of Statistics publishes a new CPI figure. Each entry needs the date the
# figure is about (observation_date) and the date it became public (release_date): a
# value is only used for trading sessions on or after its release date.

# 6-month KIBOR is not collected yet. It is estimated as the policy rate plus this spread
# (percentage points). Replace with real KIBOR data when a reliable source is added.
